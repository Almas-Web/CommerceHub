services:
  db:
    image: postgres:16
    container_name: commercehub_db_prod
    restart: unless-stopped
    environment:
      POSTGRES_DB: commercehub
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: commercehub_redis_prod
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Dockerfile.prod
    container_name: commercehub_web_prod
    restart: unless-stopped
    command: gunicorn src.wsgi:application --bind 0.0.0.0:8000

    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media

    environment:
      SECRET_KEY: "temporary-production-key"
      DEBUG: "False"

      DB_NAME: commercehub
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_HOST: db
      DB_PORT: 5432

      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0

      EMAIL_HOST: smtp.gmail.com
      EMAIL_PORT: 587
      EMAIL_USE_TLS: "True"
      EMAIL_HOST_USER: ${EMAIL_HOST_USER}
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD}
      DEFAULT_FROM_EMAIL: ${EMAIL_HOST_USER}

    depends_on:
      - db
      - redis

    ports:
      - "8010:8000"

  celery:
    build:
      context: .
      dockerfile: Dockerfile.prod
    container_name: commercehub_celery_prod
    restart: unless-stopped
    command: celery -A src worker --loglevel=info

    environment:
      SECRET_KEY: "temporary-production-key"
      DEBUG: "False"

      DB_NAME: commercehub
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_HOST: db
      DB_PORT: 5432

      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0

      EMAIL_HOST: smtp.gmail.com
      EMAIL_PORT: 587
      EMAIL_USE_TLS: "True"
      EMAIL_HOST_USER: ${EMAIL_HOST_USER}
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD}
      DEFAULT_FROM_EMAIL: ${EMAIL_HOST_USER}

    depends_on:
      - db
      - redis

  nginx:
    image: nginx:alpine
    container_name: commercehub_nginx_prod
    restart: unless-stopped

    ports:
      - "8080:80"

    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - static_volume:/staticfiles:ro
      - media_volume:/media:ro

    depends_on:
      - web

volumes:
  postgres_prod_data:
  static_volume:
  media_volume: