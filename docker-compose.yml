services:
  db:
    image: postgres:16
    container_name: commercehub_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: commercehub
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: commercehub_redis
    restart: unless-stopped
    ports:
      - "6381:6379"

volumes:
  postgres_data: